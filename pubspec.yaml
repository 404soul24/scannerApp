name: absence_scanner_app
description: "AI-powered absence sheet scanner using Supabase Edge Function + Gemini."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for Supabase Edge Function calls
  http: ^1.3.0

  # Image picking from camera or gallery
  image_picker: ^1.1.2

  # Share absent list
  share_plus: ^10.1.4

  # Local storage for scan history
  shared_preferences: ^2.3.5

  # File path access for export
  path_provider: ^2.1.5

  # PDF generation
  pdf: ^3.11.2

  # CSV export
  csv: ^6.0.0

  # File picker for import
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App icon generation
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
