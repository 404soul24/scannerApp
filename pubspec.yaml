name: absence_scanner_app
description: "OCR-powered absence sheet scanner using Google ML Kit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # OCR — on-device text recognition via Google ML Kit
  google_mlkit_text_recognition: ^0.14.0

  # Image picking from camera or gallery
  image_picker: ^1.1.2

  # Share absent list
  share_plus: ^10.1.4

  # Local storage for scan history
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App icon generation
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
